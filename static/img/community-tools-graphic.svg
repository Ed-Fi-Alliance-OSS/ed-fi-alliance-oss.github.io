<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="community-tools-graphic-title">
  <title id="community-tools-graphic-title">Diagram showing States, Districts &amp; Vendors on both sides contributing to and drawing from Ed-Fi Community Tools</title>

  <defs>
    <g id="building">
      <rect x="0" y="18" width="52" height="42" fill="none" stroke="#EC008C" stroke-width="2.5"/>
      <polyline points="0,18 26,2 52,18" fill="none" stroke="#EC008C" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="26" y1="2" x2="26" y2="-12" stroke="#EC008C" stroke-width="2.5"/>
      <path d="M26,-12 L40,-8 L26,-4 Z" fill="#EC008C"/>
      <circle cx="26" cy="34" r="7" fill="none" stroke="#EC008C" stroke-width="2"/>
      <line x1="26" y1="34" x2="26" y2="29" stroke="#EC008C" stroke-width="1.5"/>
      <line x1="26" y1="34" x2="30" y2="34" stroke="#EC008C" stroke-width="1.5"/>
      <rect x="8" y="46" width="8" height="12" fill="none" stroke="#EC008C" stroke-width="2"/>
      <rect x="36" y="46" width="8" height="12" fill="none" stroke="#EC008C" stroke-width="2"/>
    </g>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0031F1"/>
    </marker>
  </defs>

  <text x="40" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1c1e21">States, Districts</text>
  <text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1c1e21">&amp; Vendors</text>
  <use href="#building" x="30" y="75"/>

  <text x="500" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1c1e21">States, Districts</text>
  <text x="500" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1c1e21">&amp; Vendors</text>
  <use href="#building" x="550" y="75"/>

  <line x1="150" y1="170" x2="240" y2="230" stroke="#0031F1" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="230" x2="400" y2="170" stroke="#0031F1" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <rect x="210" y="270" width="220" height="90" rx="18" fill="none" stroke="#0031F1" stroke-width="2.5"/>
  <text x="320" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1e21" text-anchor="middle">Ed-Fi</text>
  <text x="320" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0031F1" text-anchor="middle">Community Tools</text>
</svg>
