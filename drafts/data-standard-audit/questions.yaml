# Synthetic new-learner question set for the Ed-Fi Data Standard documentation audit.
# Phase 1 output, 2026-10-10. AI-generated; review before use.
#
# - question: written in the voice of someone new to the Ed-Fi Data Standard, typing
#   into a search or answer engine restricted to docs.ed-fi.org. Wording deliberately
#   avoids copying page headings so retrieval tests are not inflated.
# - type: definition | relationship | how-to | change-history | orientation
# - domain: v6 model-reference folder name, or "conceptual" / "version-sensitive"
# - version: Data Standard major version the answer should come from ("6", "5"),
#   or "any" for unversioned UDM concept pages.
# - expected_urls: published paths from working/inventory.csv `url`; best answer first.
#   An empty list plus a "gap:" note means no in-scope page answers the question today.
# - notes: what a good answer must contain, or "partial:" when the answer is incomplete.

questions:
