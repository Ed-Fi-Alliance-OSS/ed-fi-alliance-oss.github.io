default: true
line-length: false
no-inline-html:
  allowed_elements:
    - codapi-snippet
    - kbd
    - DocCardList
    - details
    - summary
    - br
    - iframe
    - sup
emphasis-style:
  style: underscore
ul-style:
  style: consistent
table-pipe-style:
  style: leading_and_trailing
no-duplicate-heading:
  siblings_only: true
# MD060 (table-column-style) arrived with markdownlint 0.39 and flags ~16,500
# existing table cells. Disabled for now; revisit separately (DOC-270).
table-column-style: false
